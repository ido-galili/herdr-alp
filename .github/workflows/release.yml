# Publishes the release a merged pull request prepared. A PR titled feat, fix or perf (or with a
# "!") ends with a release commit (scripts/release-commit.sh) that sets CHANGELOG.md and the
# plugin's version, so its squash merge lands on main already released in name. This tags that
# merge and creates the GitHub Release from its CHANGELOG.md section. Nothing is pushed to main,
# so the "Protect main" rule needs no way around it.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(jq -r .version plugins/alp/.claude-plugin/plugin.json)"
          if gh release view "$version" > /dev/null 2>&1; then
            echo "$version is already released: this merge has no release commit."; exit 0
          fi
          # Only a release commit writes a version's section into CHANGELOG.md.
          if ! grep -q "^## \[${version#v}\]" CHANGELOG.md 2> /dev/null; then
            echo "No release commit in this merge."; exit 0
          fi
          awk -v head="## [${version#v}]" 'index($0, head) == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
          gh release create "$version" --target "$GITHUB_SHA" --title "$version" --notes-file notes.md
