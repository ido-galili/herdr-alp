# Checks on every pull request: its title (it becomes the squash commit and a changelog line),
# lint, and the format of the files it changes.
name: PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

env:
  # husky only sets up git hooks on your machine.
  HUSKY: 0

permissions:
  contents: read

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The title goes in through an environment variable, never pasted into the script.
      - name: Check the title with commitlint
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | npx commitlint

  lint:
    name: Lint and format
    # Editing the title alone changes no files.
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: oxlint
        run: npx oxlint
      # Only the files this PR changes, until the one-time format of every file lands.
      - name: oxfmt on the changed files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only --diff-filter=ACMR "$BASE"...HEAD -- '*.js' '*.mjs' '*.ts' '*.json' ':!package-lock.json' > changed.txt
          if [ -s changed.txt ]; then xargs -d '\n' npx oxfmt --check < changed.txt; else echo "No JS, TS or JSON changed."; fi
